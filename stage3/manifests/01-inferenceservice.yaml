apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: kserve-qwen
  namespace: kserve-test
  annotations:
    serving.kserve.io/deploymentMode: "RawDeployment"
spec:
  predictor:
    containers:
      - name: kserve-container
        image: kserve-predictor:v1
        imagePullPolicy: IfNotPresent
        env:
          - name: MODEL_NAME
            value: "kserve-qwen"
          - name: OLLAMA_BASE_URL
            value: "http://172.19.0.1:11434"
          - name: OLLAMA_MODEL
            value: "qwen2.5:0.5b"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
